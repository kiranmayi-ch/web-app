<!DOCTYPE html>
<html>
<body>
<h2>JavaScript Data Types</h2>
<p id="output"></p>

<script>
let name = "Kiranmayi";
let age = 20;
let marks = 95.5;
let isStudent = true;
let value = null;

document.getElementById("output").innerHTML =
    "Name: " + name + "<br>" +
    "Age: " + age + "<br>" +
    "Marks: " + marks + "<br>" +
    "Student: " + isStudent + "<br>" +
    "Value: " + value;
</script>

</body>
</html>
