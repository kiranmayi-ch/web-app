<!DOCTYPE html>
<html>
<head>
    <title>Student Result</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 50px;
        }

        .box {
            background: white;
            width: 450px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            padding: 10px;
            width: 150px;
            margin: 5px;
        }

        button {
            padding: 10px 25px;
            margin-top: 15px;
        }

        #result {
            margin-top: 25px;
            font-size: 18px;
            line-height: 1.8;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Student Result</h1>

    <input type="number" id="m1" placeholder="Subject 1">
    <input type="number" id="m2" placeholder="Subject 2">
    <br>
    <input type="number" id="m3" placeholder="Subject 3">
    <input type="number" id="m4" placeholder="Subject 4">
    <br>
    <input type="number" id="m5" placeholder="Subject 5">

    <br>

    <button onclick="calculateResult()">
        Calculate Result
    </button>

    <div id="result"></div>

</div>

<script>

function calculateResult() {

    let m1 = Number(document.getElementById("m1").value);
    let m2 = Number(document.getElementById("m2").value);
    let m3 = Number(document.getElementById("m3").value);
    let m4 = Number(document.getElementById("m4").value);
    let m5 = Number(document.getElementById("m5").value);

    let total = m1 + m2 + m3 + m4 + m5;

    let average = total / 5;

    let percentage = (total / 500) * 100;

    let grade;

    if (percentage >= 90) {
        grade = "A";
    }
    else if (percentage >= 80) {
        grade = "B";
    }
    else if (percentage >= 70) {
        grade = "C";
    }
    else if (percentage >= 60) {
        grade = "D";
    }
    else {
        grade = "F";
    }

    document.getElementById("result").innerHTML =
        "Total Marks: " + total + "<br>" +
        "Average: " + average + "<br>" +
        "Percentage: " + percentage + "%<br>" +
        "Grade: " + grade;
}

</script>

</body>
</html>
