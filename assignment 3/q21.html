<!DOCTYPE html>
<html>
<head>
    <title>Email Validation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding-top: 80px;
            background: #f2f2f2;
        }

        .box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 250px;
        }

        button {
            padding: 10px 20px;
            margin-top: 15px;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Email Validation</h1>

    <input type="text" id="email" placeholder="Enter Email">

    <br>

    <button onclick="validateEmail()">Validate</button>

    <p id="result"></p>

</div>

<script>
function validateEmail() {

    let email = document.getElementById("email").value;

    let pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (pattern.test(email)) {
        document.getElementById("result").innerHTML =
            "✓ Valid Email Address";
    } else {
        document.getElementById("result").innerHTML =
            "✗ Invalid Email Address";
    }
}
</script>

</body>
</html>
