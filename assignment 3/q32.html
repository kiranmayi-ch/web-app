<!DOCTYPE html>
<html>
<head>
    <title>Mouseover Event</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
        }

        button {
            padding: 20px 40px;
            font-size: 20px;
        }
    </style>
</head>

<body>

<h1>Mouseover Event</h1>

<button onmouseover="changeColor()"
        onmouseout="resetColor()">
    Move Mouse Over Me
</button>

<script>
function changeColor() {
    document.body.style.backgroundColor = "lightblue";
}

function resetColor() {
    document.body.style.backgroundColor = "white";
}
</script>

</body>
</html>
