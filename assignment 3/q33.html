<!DOCTYPE html>
<html>
<head>
    <title>Mouse Coordinates</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding-top: 50px;
        }

        #box {
            width: 500px;
            height: 250px;
            border: 3px solid black;
            margin: auto;
            background: #eeeeee;
        }

        #result {
            font-size: 20px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h1>Mouse Coordinates</h1>

<div id="box" onmousemove="showCoordinates(event)">
    Move your mouse inside this box
</div>

<p id="result">X: 0 | Y: 0</p>

<script>
function showCoordinates(event) {

    document.getElementById("result").innerHTML =
        "X: " + event.clientX +
        " | Y: " + event.clientY;
}
</script>

</body>
</html>
