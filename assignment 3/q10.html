<!DOCTYPE html>
<html>
<head>
    <title>Prime Number</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 80px;
        }

        .box {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            padding: 10px;
            width: 150px;
        }

        button {
            padding: 10px 20px;
            margin-top: 15px;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Prime Number Checker</h1>

    <input type="number" id="num" placeholder="Enter number">

    <br>

    <button onclick="checkPrime()">Check Prime</button>

    <div id="result"></div>

</div>

<script>

function checkPrime() {

    let n = Number(document.getElementById("num").value);

    let isPrime = true;

    if (n < 2) {
        isPrime = false;
    }

    for (let i = 2; i < n; i++) {

        if (n % i == 0) {
            isPrime = false;
            break;
        }
    }

    if (isPrime) {
        document.getElementById("result").innerHTML =
            n + " is a Prime Number";
    }
    else {
        document.getElementById("result").innerHTML =
            n + " is Not a Prime Number";
    }
}

</script>

</body>
</html>
