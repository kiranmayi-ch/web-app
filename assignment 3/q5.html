<!DOCTYPE html>
<html>
<head>
    <title>Even or Odd</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 80px;
        }

        .box {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            padding: 10px;
            width: 150px;
        }

        button {
            padding: 10px 20px;
            margin-top: 15px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Even or Odd</h1>

    <input type="number" id="num" placeholder="Enter a number">

    <br>

    <button onclick="checkNumber()">Check</button>

    <div id="result"></div>

</div>

<script>

function checkNumber() {

    let num = Number(document.getElementById("num").value);

    if (num % 2 == 0) {
        document.getElementById("result").innerHTML =
            num + " is Even";
    }
    else {
        document.getElementById("result").innerHTML =
            num + " is Odd";
    }
}

</script>

</body>
</html>
