<!DOCTYPE html>
<html>
<head>
    <title>Reverse Number</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 80px;
        }

        .box {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            padding: 10px;
            width: 180px;
        }

        button {
            padding: 10px 20px;
            margin-top: 15px;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Reverse Number</h1>

    <input type="number" id="num" placeholder="Enter number">

    <br>

    <button onclick="reverseNumber()">Reverse</button>

    <div id="result"></div>

</div>

<script>

function reverseNumber() {

    let n = Number(document.getElementById("num").value);

    let reverse = 0;

    while (n != 0) {

        let digit = n % 10;

        reverse = reverse * 10 + digit;

        n = Math.floor(n / 10);
    }

    document.getElementById("result").innerHTML =
        "Reversed number = " + reverse;
}

</script>

</body>
</html>
