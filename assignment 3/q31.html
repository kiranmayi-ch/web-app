<!DOCTYPE html>
<html>
<head>
    <title>Click Event</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<h1>Click Event</h1>

<button onclick="showAlert()">Click Me</button>

<script>
function showAlert() {
    alert("Button was clicked!");
}
</script>

</body>
</html>
