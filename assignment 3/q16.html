<!DOCTYPE html>
<html>
<head>
    <title>Background Color</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<h1>Change Background Color</h1>

<button onclick="changeColor()">Change Color</button>

<script>
function changeColor() {
    document.body.style.backgroundColor = "lightblue";
}
</script>

</body>
</html>
