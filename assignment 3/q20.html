<!DOCTYPE html>
<html>
<head>
    <title>Web Calculator</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding-top: 60px;
        }

        .calculator {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 120px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
        }

        #result {
            font-size: 22px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>Calculator</h1>

    <input type="number" id="num1" placeholder="Number 1">
    <input type="number" id="num2" placeholder="Number 2">

    <br><br>

    <button onclick="calculate('+')">+</button>
    <button onclick="calculate('-')">−</button>
    <button onclick="calculate('*')">×</button>
    <button onclick="calculate('/')">÷</button>

    <div id="result"></div>

</div>

<script>
function calculate(operator) {

    let a = Number(document.getElementById("num1").value);
    let b = Number(document.getElementById("num2").value);

    let result;

    switch (operator) {

        case "+":
            result = a + b;
            break;

        case "-":
            result = a - b;
            break;

        case "*":
            result = a * b;
            break;

        case "/":
            result = a / b;
            break;
    }

    document.getElementById("result").innerHTML =
        "Result = " + result;
}
</script>

</body>
</html>
