<!DOCTYPE html>
<html>
<head>
    <title>Multiplication Table</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 50px;
        }

        .box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            padding: 10px;
            width: 150px;
        }

        button {
            padding: 10px 20px;
            margin: 15px;
        }

        #result {
            font-size: 18px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Multiplication Table</h1>

    <input type="number" id="num" placeholder="Enter number">

    <br>

    <button onclick="generateTable()">
        Generate Table
    </button>

    <div id="result"></div>

</div>

<script>

function generateTable() {

    let n = Number(document.getElementById("num").value);

    let output = "";

    for (let i = 1; i <= 10; i++) {

        output += n + " × " + i +
                  " = " + (n * i) + "<br>";
    }

    document.getElementById("result").innerHTML = output;
}

</script>

</body>
</html>
