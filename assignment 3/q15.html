<!DOCTYPE html>
<html>
<head>
    <title>Change Text</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding-top: 80px;
            background: #f2f2f2;
        }

        .box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            margin-top: 15px;
        }

        #text {
            font-size: 22px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>DOM Manipulation</h1>

    <p id="text">This is the original text.</p>

    <button onclick="changeText()">Change Text</button>

</div>

<script>
function changeText() {
    document.getElementById("text").innerHTML =
        "The text has been changed!";
}
</script>

</body>
</html>
