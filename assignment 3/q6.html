<!DOCTYPE html>
<html>
<head>
    <title>Largest of Three Numbers</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 60px;
        }

        .box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            padding: 10px;
            width: 100px;
            margin: 5px;
        }

        button {
            padding: 10px 25px;
            margin-top: 15px;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Largest Number</h1>

    <input type="number" id="num1" placeholder="Number 1">
    <input type="number" id="num2" placeholder="Number 2">
    <input type="number" id="num3" placeholder="Number 3">

    <br>

    <button onclick="findLargest()">Find Largest</button>

    <div id="result"></div>

</div>

<script>

function findLargest() {

    let a = Number(document.getElementById("num1").value);
    let b = Number(document.getElementById("num2").value);
    let c = Number(document.getElementById("num3").value);

    let largest;

    if (a >= b && a >= c) {
        largest = a;
    }
    else if (b >= a && b >= c) {
        largest = b;
    }
    else {
        largest = c;
    }

    document.getElementById("result").innerHTML =
        "Largest number is: " + largest;
}

</script>

</body>
</html>
