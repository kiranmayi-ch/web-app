<!DOCTYPE html>
<html>
<head>
    <title>Username Validation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding-top: 80px;
            background: #f2f2f2;
        }

        .box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 220px;
        }

        button {
            padding: 10px 20px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Username Validation</h1>

    <p>5–15 characters: alphabets, digits and underscore</p>

    <input type="text" id="username" placeholder="Enter Username">

    <br>

    <button onclick="checkUsername()">Validate</button>

    <p id="result"></p>

</div>

<script>
function checkUsername() {

    let username = document.getElementById("username").value;

    let pattern = /^[A-Za-z0-9_]{5,15}$/;

    if (pattern.test(username)) {
        result.innerHTML = "✓ Valid Username";
    } else {
        result.innerHTML = "✗ Invalid Username";
    }
}
</script>

</body>
</html>
