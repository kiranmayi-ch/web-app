<!DOCTYPE html>
<html>
<head>
    <title>Character Counter</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
            padding-top: 70px;
        }

        .box {
            background: white;
            width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        textarea {
            width: 400px;
            height: 150px;
            padding: 10px;
            font-size: 16px;
        }

        #count {
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Character Counter</h1>

    <textarea id="text"
              placeholder="Start typing..."
              onkeyup="countCharacters()"></textarea>

    <p>
        Characters:
        <span id="count">0</span>
    </p>

</div>

<script>
function countCharacters() {

    let text = document.getElementById("text").value;

    document.getElementById("count").innerHTML =
        text.length;
}
</script>

</body>
</html>
